<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>EWU Schedule Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:    #070b14;
    --bg-base:    #0d1320;
    --bg-card:    #111827;
    --bg-surface: #162032;
    --bg-row-alt: #0f1a2a;
    --border:     #1e3a5f;
    --border-glow:#2563eb44;
    --cyan:       #38bdf8;
    --blue:       #3b82f6;
    --blue-bright:#60a5fa;
    --indigo:     #6366f1;
    --text-primary: #e2e8f0;
    --text-muted:   #64748b;
    --text-dim:     #334155;
    --accent-green: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow in center */
  body::after {
    content: '';
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 400px;
    background: radial-gradient(ellipse at center, rgba(37,99,235,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header branding */
  .site-header {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 28px;
  }
  .site-header h1 {
    font-family: 'Orbitron', monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--blue-bright);
    text-shadow: 0 0 24px rgba(96,165,250,0.5), 0 0 48px rgba(59,130,246,0.2);
    text-transform: uppercase;
  }
  .site-header .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
  }
  .header-line {
    width: 200px;
    height: 1px;
    margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 1;
    background: var(--bg-card);
    border-radius: 4px;
    border: 1px solid var(--border);
    padding: 32px 28px;
    width: 100%;
    max-width: 1000px;
    box-shadow:
      0 0 0 1px rgba(37,99,235,0.1),
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(96,165,250,0.06);
  }

  /* Corner accents */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--blue);
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* Upload section */
  .upload-section { padding: 8px 0 24px; }
  .upload-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .upload-label-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    color: var(--cyan);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .upload-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #fileInput { display: none; }

  .choose-btn {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--blue) 0%, var(--indigo) 100%);
    padding: 10px 28px;
    border-radius: 3px;
    cursor: pointer;
    border: none;
    display: inline-block;
    transition: all 0.2s;
    box-shadow: 0 0 16px rgba(59,130,246,0.4);
    position: relative;
  }
  .choose-btn:hover {
    box-shadow: 0 0 28px rgba(59,130,246,0.7);
    transform: translateY(-1px);
  }

  .file-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .error-msg {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: #f87171;
    letter-spacing: 1px;
    margin-top: 4px;
    display: none;
    text-align: center;
  }
  .error-msg::before { content: '⚠ '; }

  /* Divider before table */
  .section-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 4px 0 0;
  }

  /* Schedule table */
  #schedule-container { margin-top: 0; overflow-x: auto; }
  #schedule-container::-webkit-scrollbar { height: 4px; }
  #schedule-container::-webkit-scrollbar-track { background: var(--bg-base); }
  #schedule-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 500px;
  }

  .schedule-table thead tr {
    background: linear-gradient(90deg, #0f1f3d 0%, #162744 50%, #0f1f3d 100%);
    border-bottom: 1px solid var(--blue);
  }
  .schedule-table thead th {
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
    font-weight: 400;
    padding: 14px 16px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    border-right: 1px solid rgba(30,58,95,0.5);
  }
  .schedule-table thead th:first-child {
    text-align: left;
    color: var(--blue-bright);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
  }
  .schedule-table thead th:last-child { border-right: none; }

  .schedule-table tbody tr {
    border-bottom: 1px solid rgba(30,58,95,0.4);
    transition: background 0.15s;
  }
  .schedule-table tbody tr:last-child { border-bottom: none; }
  .schedule-table tbody tr:hover { background: rgba(37,99,235,0.06) !important; }

  .schedule-table tbody td {
    padding: 16px 14px;
    text-align: center;
    vertical-align: middle;
    color: var(--text-dim);
    font-size: 13px;
    border-right: 1px solid rgba(30,58,95,0.25);
  }
  .schedule-table tbody td:last-child { border-right: none; }

  .schedule-table tbody td:first-child {
    text-align: left;
    font-family: 'Orbitron', monospace;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text-primary);
    white-space: nowrap;
    border-right: 1px solid var(--border);
  }

  .schedule-table tbody tr:nth-child(odd)  { background: var(--bg-card); }
  .schedule-table tbody tr:nth-child(even) { background: var(--bg-row-alt); }

  .cell-course {
    font-family: 'Share Tech Mono', monospace;
    color: var(--blue-bright);
    font-weight: 400;
    font-size: 12px;
    display: block;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(96,165,250,0.4);
  }
  .cell-room {
    color: var(--text-muted);
    font-size: 11px;
    display: block;
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  /* Save buttons */
  #save-buttons {
    display: none;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
  }
  .save-btn {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 26px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.2s;
  }
  .save-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .btn-image {
    background: rgba(59,130,246,0.1);
    color: var(--blue-bright);
    border-color: var(--blue);
    box-shadow: 0 0 12px rgba(59,130,246,0.15), inset 0 0 12px rgba(59,130,246,0.05);
  }
  .btn-image:hover {
    background: rgba(59,130,246,0.2);
    box-shadow: 0 0 24px rgba(59,130,246,0.4), inset 0 0 12px rgba(59,130,246,0.1);
    transform: translateY(-1px);
  }
  .btn-pdf {
    background: rgba(16,185,129,0.08);
    color: #34d399;
    border-color: var(--accent-green);
    box-shadow: 0 0 12px rgba(16,185,129,0.15), inset 0 0 12px rgba(16,185,129,0.05);
  }
  .btn-pdf:hover {
    background: rgba(16,185,129,0.18);
    box-shadow: 0 0 24px rgba(16,185,129,0.35), inset 0 0 12px rgba(16,185,129,0.1);
    transform: translateY(-1px);
  }

  /* Footer */
  footer {
    position: relative;
    z-index: 1;
    margin-top: 28px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
  }
  footer a {
    color: var(--blue-bright);
    text-decoration: none;
    transition: color 0.2s;
  }
  footer a:hover { color: var(--cyan); text-shadow: 0 0 8px rgba(56,189,248,0.5); }
</style>
</head>
<body>

<div class="card">
  <div class="upload-section">
    <div class="upload-inner">
      <label class="upload-label-text">Upload Your Advising Slip in Excel Format</label>
      <div class="upload-row">
        <input type="file" id="fileInput" accept=".xlsx">
        <label for="fileInput" class="choose-btn">Choose File</label>
        <span class="file-name" id="file-name-display"></span>
      </div>
      <p class="error-msg" id="error-msg">Could not parse the file. Please upload a valid EWU advising slip.</p>
    </div>
  </div>
  <div id="schedule-container"></div>
  <div id="save-buttons">
    <button class="save-btn btn-image" onclick="saveAsImage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Save as Image
    </button>
    <button class="save-btn btn-pdf" onclick="saveAsPDF()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Save as PDF
    </button>
  </div>
</div>

<footer>
  Created by <a href="https://adib23704.com" target="_blank" rel="noopener noreferrer">Zahin A. Adib</a></br>
  Improved by <a href="https://tofuii.me" target="_blank" rel="noopener noreferrer">Tofu</a>

</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// EWU day-code mapping
// S=Sunday, M=Monday, T=Tuesday, W=Wednesday, R=Thursday
const DAY_MAP = { S:'Sunday', M:'Monday', T:'Tuesday', W:'Wednesday', R:'Thursday' };
const DAY_ORDER = ['Sunday','Monday','Tuesday','Wednesday','Thursday'];

// Fixed column indices (0-based)
// C=2, Q=16, BA=52, BM=64
const COL_COURSE = 2;
const COL_SEC    = 16;
const COL_TIME   = 52;
const COL_ROOM   = 64;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('file-name-display').textContent = file.name;
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('schedule-container').innerHTML = '';

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array', raw: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
      const entries = parseEntries(rows);
      if (entries.length === 0) throw new Error('no entries');
      renderSchedule(entries);
    } catch(err) {
      document.getElementById('error-msg').style.display = 'block';
    }
  };
  reader.readAsArrayBuffer(file);
});

function parseEntries(rows) {
  const entries = [];

  // Find the header row where col C = "Course(s)"
  let dataStart = -1;
  for (let i = 0; i < rows.length; i++) {
    const c = rows[i][COL_COURSE];
    if (c && String(c).trim() === 'Course(s)') { dataStart = i + 1; break; }
  }
  if (dataStart === -1) return entries;

  // Track the last seen course label — continuation rows have blank C but filled BA/BM
  let lastLabel = '';
  // Track how many consecutive blank-C rows we've seen (stop after too many)
  let blankCStreak = 0;

  for (let i = dataStart; i < rows.length; i++) {
    const row = rows[i];
    const courseRaw = row[COL_COURSE] ? String(row[COL_COURSE]).trim() : '';
    const timeRaw   = row[COL_TIME]   ? String(row[COL_TIME]).trim()   : '';
    const roomRaw   = row[COL_ROOM]   ? String(row[COL_ROOM]).trim()   : '';
    const secRaw    = row[COL_SEC]    ? String(row[COL_SEC]).trim()    : '';

    // If course column has a value, check if it's a fee/stop row
    if (courseRaw) {
      blankCStreak = 0;
      const lower = courseRaw.toLowerCase();
      if (lower.includes('tuition fee') || lower.includes('grand total') || lower.includes('laboratory fee')) break;

      // New course — build label and remember it
      lastLabel = secRaw ? `${courseRaw} (${secRaw})` : courseRaw;
    } else {
      // Blank course column — continuation row (same course, different day/time)
      blankCStreak++;
      // If too many blank rows in a row with no time data, stop
      if (blankCStreak > 6 && !timeRaw) break;
      if (!timeRaw) continue; // blank row with no time — skip but keep going
    }

    // Skip if no time data
    if (!timeRaw || !lastLabel) continue;

    // Parse time-weekday: "MW 11:50AM-1:20PM" or "R 4:50PM-6:20PM"
    const match = timeRaw.match(/^([A-Z]+)\s+(.+)$/);
    if (!match) continue;

    const dayCodes = match[1];
    const timeRange = match[2].replace(/\s+/g, '');
    // Strip parenthetical room description: "460 (Physics Lab)" -> "460"
    const room = roomRaw.replace(/\s*\(.*?\)\s*$/, '').trim();

    for (const ch of dayCodes) {
      const day = DAY_MAP[ch];
      if (day) entries.push({ course: lastLabel, day, time: timeRange, room });
    }
  }
  return entries;
}

function renderSchedule(entries) {
  const timeSet = new Set(entries.map(e => e.time));
  const times = sortTimes([...timeSet]);

  const lookup = {};
  DAY_ORDER.forEach(d => { lookup[d] = {}; times.forEach(t => { lookup[d][t] = []; }); });
  entries.forEach(e => { if (lookup[e.day]) lookup[e.day][e.time].push(e); });

  let html = '<table class="schedule-table"><thead><tr><th>Day</th>';
  times.forEach(t => { html += `<th>${t}</th>`; });
  html += '</tr></thead><tbody>';

  DAY_ORDER.forEach(day => {
    html += `<tr><td>${day}</td>`;
    times.forEach(t => {
      const cells = lookup[day][t];
      if (!cells.length) {
        html += '<td>-</td>';
      } else {
        html += '<td>' + cells.map(c =>
          `<span class="cell-course">${c.course}</span><span class="cell-room">${c.room}</span>`
        ).join('') + '</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('schedule-container').innerHTML = html;
  document.getElementById('save-buttons').style.display = 'flex';
}

function sortTimes(times) {
  return times.sort((a, b) => {
    const [aStart, aEnd] = a.split('-');
    const [bStart, bEnd] = b.split('-');
    const startDiff = toMin(aStart) - toMin(bStart);
    if (startDiff !== 0) return startDiff;
    return toMin(aEnd) - toMin(bEnd);
  });
}

function toMin(t) {
  const m = t.match(/(\d+):(\d+)(AM|PM)/i);
  if (!m) return 0;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  if (m[3].toUpperCase() === 'PM' && h !== 12) h += 12;
  if (m[3].toUpperCase() === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}function getTableElement() {
  return document.querySelector('#schedule-container');
}

async function saveAsImage() {
  const el = getTableElement();
  if (!el) return;
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  const link = document.createElement('a');
  link.download = 'ewu-schedule.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function saveAsPDF() {
  const el = getTableElement();
  if (!el) return;
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width / 2, canvas.height / 2] });
  pdf.addImage(imgData, 'PNG', 0, 0, canvas.width / 2, canvas.height / 2);
  pdf.save('ewu-schedule.pdf');
}
</script>
</body>
</html>
